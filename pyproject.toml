[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegiscorp-os"
version = "1.0.0"
description = "Governed Multi-Agent Corporate Digital Twin and Enterprise Operating System"
readme = "README.md"
authors = [{ name = "Raj sekhar parhi", email = "rapr1461@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aegiscorp = "aegiscorp.cli.main:app"

[tool.setuptools.packages.find]
include = ["aegiscorp*"]
